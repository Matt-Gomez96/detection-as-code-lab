# Test case for rules/windows/win_security_log_cleared.yml
#
# samples:        public attack logs, downloaded and verified by SHA-256 (see datasets.yml).
#                 expected_matches = exact number of events the rule must match.
# benign_events:  invented but realistic events that must NOT match.
# mutations:      deliberately broken versions of the rule; at least one check above
#                 must fail for each (see src/detlab/mutation.py).

samples:
  - source: evtx-attack-samples
    file: Defense Evasion/DE_1102_security_log_cleared.evtx
    sha256: a0615707b547a2ac254688fd725c3c590f62440fc9b7947c2843dd40498a39e8
    # 112 events: the 1102 clear must match; the 110 x 4663 and 1 x 5156 must not.
    expected_matches: 1

  - source: evtx-attack-samples
    file: Defense Evasion/DE_104_system_log_cleared.evtx
    sha256: 5579cdca073ee4864ea82d656aa2d25400b5c1e85b8e688db5d85f6dc558c2af
    # Clearing the System log (104) is a different rule: this one must stay silent.
    expected_matches: 0

benign_events:
  - name: Event log service shut down (1100)
    why: Same provider and channel as 1102. Logged on every normal shutdown.
    event:
      EventID: 1100
      Channel: Security
      Provider_Name: Microsoft-Windows-Eventlog
      Computer: WS01.lab.local

  - name: Security log is full (1104)
    why: Same provider and channel as 1102. An operational problem, not a clear.
    event:
      EventID: 1104
      Channel: Security
      Provider_Name: Microsoft-Windows-Eventlog
      Computer: WS01.lab.local

mutations:
  - name: Wrong event ID (1100)
    why: A typo in the event ID; 1100 is the event log service shutting down.
    edits:
      - replace: 'EventID: 1102'
        with: 'EventID: 1100'

  - name: Wrong log (System instead of Security)
    why: Copied from the System rule; 1102 is only written to the Security log.
    edits:
      - replace: 'service: security'
        with: 'service: system'

  - name: No Provider_Name condition
    why: Event IDs are only unique within a provider.
    survives: >-
      Defensive condition, kept on purpose: no public sample or realistic event has a
      1102 from another provider in the Security log, so no test can tell the difference.
    edits:
      - delete: 'Provider_Name: Microsoft-Windows-Eventlog'
